name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:frontend
      - run: npm run build:frontend
      - run: npm audit --omit=dev --audit-level=high
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t company-erp-backend-test apps/backend
      - run: docker build -t company-erp-backend apps/backend
      - name: Validate compose
        env:
          APP_ORIGIN: http://localhost:8088
          POSTGRES_DATABASE: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: ci-only-not-a-secret
          REDIS_PASSWORD: ci-redis-only-not-a-secret
          KEYCLOAK_ADMIN_USER: ci-admin
          KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-only-not-a-secret
          HR_DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: docker compose config --quiet
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: apps/backend/pom.xml
      - run: mvn -B -f apps/backend/pom.xml -Pintegration verify
