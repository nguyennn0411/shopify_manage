name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/erp?schema=public
      REDIS_URL: redis://localhost:6379
      APP_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://localhost:4000
      CSRF_SECRET: cdcadcadcadcadcadcadcadcadcadcadcadcadcadcadcadcadcadcadcadcadca
      MFA_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
      INTEGRATION_ENCRYPTION_KEY: bcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbcbc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
