name: company-erp
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-erp}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes: ["redis_data:/data"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: ["start", "--import-realm", "--http-enabled=true", "--proxy-headers=xforwarded"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DATABASE:-erp}
      KC_DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?KEYCLOAK_ADMIN_USER is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${APP_ORIGIN:?APP_ORIGIN is required}/auth
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./infra/keycloak/company-erp-realm.json:/opt/keycloak/data/import/company-erp-realm.json:ro
    networks: [edge, data]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  keycloak-role-sync:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/keycloak/config/sync-hr-roles.sh"]
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: company-erp
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:?KEYCLOAK_ADMIN_USER is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
    volumes:
      - ./infra/keycloak/sync-hr-roles.sh:/opt/keycloak/config/sync-hr-roles.sh:ro
    networks: [data]
    depends_on:
      keycloak: { condition: service_healthy }
  backend:
    build: { context: ./apps/backend }
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DATABASE:-erp}?currentSchema=erp_v2&sslmode=disable
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SCHEMA: erp_v2
      DATABASE_SSL_MODE: disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      HR_DATA_ENCRYPTION_KEY: ${HR_DATA_ENCRYPTION_KEY:?HR_DATA_ENCRYPTION_KEY is required}
      APP_ORIGIN: ${APP_ORIGIN}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      OIDC_CLIENT_ID: erp-backend
      OIDC_CLIENT_AUTH_METHOD: none
      OIDC_PUBLIC_URL: ${APP_ORIGIN}/auth
      OIDC_INTERNAL_URL: http://keycloak:8080/auth
      OIDC_REALM: company-erp
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-false}
      DEV_SEED_COMPANY_CODE: ${DEV_SEED_COMPANY_CODE:-DEMO}
      DEV_SEED_COMPANY_NAME: ${DEV_SEED_COMPANY_NAME:-Demo Company}
      DEV_SEED_KEYCLOAK_SUBJECT: ${DEV_SEED_KEYCLOAK_SUBJECT:-dev-user-subject}
      DEV_SEED_EMAIL: ${DEV_SEED_EMAIL:-developer@example.test}
      DEV_SEED_DISPLAY_NAME: ${DEV_SEED_DISPLAY_NAME:-Development User}
    networks: [edge, data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      keycloak-role-sync: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  frontend:
    build: { context: ./apps/frontend }
    restart: unless-stopped
    networks: [edge]
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["8088:8080"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }
      keycloak: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
networks:
  edge:
  data:
    internal: true

