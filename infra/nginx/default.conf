limit_req_zone $binary_remote_addr zone=api_read:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
map $http_x_forwarded_proto $erp_forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }
upstream erp_frontend { server frontend:80; keepalive 16; }
upstream erp_backend { server backend:8080; keepalive 32; }
upstream erp_identity { server keycloak:8080; keepalive 16; }

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

  location /api/ {
    limit_req zone=api_read burst=80 nodelay;
    proxy_pass http://erp_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $erp_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /oauth2/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://erp_backend; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $erp_forwarded_proto; proxy_set_header X-Forwarded-Host $http_host; }
  location /login/oauth2/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://erp_backend; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $erp_forwarded_proto; proxy_set_header X-Forwarded-Host $http_host; }
  location /auth/ { limit_req zone=auth burst=30 nodelay; proxy_pass http://erp_identity; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $erp_forwarded_proto; proxy_set_header X-Forwarded-Host $http_host; }
  location / { proxy_pass http://erp_frontend; proxy_set_header Host $http_host; }
}
